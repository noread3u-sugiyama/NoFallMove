name: Build Paper Plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        run: |
          mvn -B package > build.log 2>&1 || (grep -E "\[ERROR\]|Error:|Exception" build.log | head -n 15 | while read line; do echo "::error::$line"; done; exit 1)

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoFallMove-plugin
          path: target/NoFallMove-*.jar
